<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Glowing Crown at top -->
  <path d="M176 170 L216 230 L256 150 L296 230 L336 170 L346 250 L166 250 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="176" cy="160" r="10" fill="#FDE047" />
  <circle cx="256" cy="140" r="12" fill="#FDE047" />
  <circle cx="336" cy="160" r="10" fill="#FDE047" />

  <!-- Supersonic Jet Wings Silhouette (Avion Crash & Speed) -->
  <path d="M256 220 L390 320 L340 330 L280 290 L280 370 L310 395 L256 385 L202 395 L232 370 L232 290 L172 330 L122 320 Z" fill="url(#neonCyan)" opacity="0.9" />

  <!-- Controller Joystick Cross in Gold -->
  <circle cx="256" cy="300" r="32" fill="#080C16" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="256" cy="300" r="14" fill="url(#goldGrad)"/>

  <!-- App Title Text -->
  <text x="256" y="445" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="38" fill="#F8FAFC" text-anchor="middle" letter-spacing="4">MASTER PLAY</text>
  <text x="256" y="475" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="18" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">KÈKÈ CHALLENGE</text>
</svg>
